name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the wheel + sdist to a GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then flag="--notes-file notes.md"; else flag="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $flag
        env: { GH_TOKEN: "${{ github.token }}" }
  pypi:
    # Turn on once PyPI has this repo as a trusted publisher: gh variable set PUBLISH_PYPI --body true
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: astral-sh/setup-uv@v6
      - run: uv publish
